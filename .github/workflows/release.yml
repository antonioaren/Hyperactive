name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    env:
      APP_PATH: build/Build/Products/Release/Hyperactive.app
      # Optional. Developer ID when MACOS_CERTIFICATE is set (and notarized if
      # the Apple ID secrets are also set). Otherwise a stable self-signed
      # identity when HYPERACTIVE_SIGNING_CERTIFICATE is set, so Accessibility
      # survives updates. With neither secret the Xcode build stays ad-hoc.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      HYPERACTIVE_SIGNING_CERTIFICATE: ${{ secrets.HYPERACTIVE_SIGNING_CERTIFICATE }}
      HYPERACTIVE_SIGNING_CERTIFICATE_PWD: ${{ secrets.HYPERACTIVE_SIGNING_CERTIFICATE_PWD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          next="$(scripts/next-version.sh)"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" && -n "$next" ]]; then
            publish=true
          fi
          if [[ -z "$next" ]]; then
            next="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)"
            next="${next:-1.0.0}"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "### Hyperactive v$next (publish: $publish)" >> "$GITHUB_STEP_SUMMARY"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test
        run: make test

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make release VERSION="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Sign release
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/sign-release.sh

      - name: Notarize
        if: env.MACOS_CERTIFICATE != '' && env.APPLE_ID != ''
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP_PATH"

      - name: Verify app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          archs="$(lipo -archs "$APP_PATH/Contents/MacOS/Hyperactive")"
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          echo "Bundle version: $actual"
          [[ "$actual" == "$VERSION" ]]

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make package source-zip VERSION="$VERSION"
          ls -lh build/dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hyperactive-${{ steps.version.outputs.version }}
          path: build/dist/*
          if-no-files-found: error

      - name: Generate release notes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" build/dist/* \
            --target "$GITHUB_SHA" \
            --title "Hyperactive v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest

      - name: Remove signing keychain
        if: always() && (env.MACOS_CERTIFICATE != '' || env.HYPERACTIVE_SIGNING_CERTIFICATE != '')
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
